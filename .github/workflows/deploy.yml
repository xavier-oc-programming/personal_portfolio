name: Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - "app/**/*.py"
      - "app/templates/**"
      - "app/static/css/**"
      - "app/static/js/**"
      - "requirements.txt"
      - "Dockerfile"
      - "wsgi.py"
      - "entrypoint.sh"
      - "railway.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deploy
        run: echo "Code change detected — Railway will deploy after this check passes."
