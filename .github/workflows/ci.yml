name: CI/CD

# Tests run on every push to main (filtered paths).
# On success, railway up deploys to Railway.
# Images are excluded from the upload via .railwayignore so the payload stays small.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**/*.py"
      - "app/templates/**"
      - "app/static/css/**"
      - "app/static/js/**"
      - "app/static/images/favicon.png"
      - "requirements.txt"
      - "Dockerfile"
      - "wsgi.py"
      - "entrypoint.sh"
      - "railway.toml"
      - ".railwayignore"
      - "app/data/admin_snapshot.json"
      - ".github/workflows/**"
      - "tests/**"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_test
          ADMIN_PASSWORD: test-password
          SECRET_KEY: test-secret-key
          TESTING: 'true'
          GROQ_API_KEY: ""
        run: pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PORTFOLIO_TOKEN }}
        run: railway up --detach
