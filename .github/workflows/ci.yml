name: CI/CD

# Runs the full test suite on code changes.
# Railway deploys after this passes (Wait for CI enabled on Railway).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**/*.py"
      - "app/templates/**"
      - "app/static/css/**"
      - "app/static/js/**"
      - "app/static/images/favicon.png"
      - "requirements.txt"
      - "Dockerfile"
      - "wsgi.py"
      - "entrypoint.sh"
      - "railway.toml"
      - ".railwayignore"
      - ".github/workflows/**"
      - "tests/**"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_test
          ADMIN_PASSWORD: test-password
          SECRET_KEY: test-secret-key
          TESTING: 'true'
          GROQ_API_KEY: ""
        run: pytest -v
