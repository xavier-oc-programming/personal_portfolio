name: CI/CD

# triggers deploy after tests pass

on:
  push:
    branches: [main]
    paths:
      - "app/**/*.py"
      - "app/templates/**"
      - "app/static/css/**"
      - "app/static/js/**"
      - "app/static/images/favicon.png"
      - "requirements.txt"
      - "Dockerfile"
      - "wsgi.py"
      - "entrypoint.sh"
      - "railway.toml"
      - ".github/workflows/**"
      - "tests/**"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_test
          ADMIN_PASSWORD: test-password
          SECRET_KEY: test-secret-key
          TESTING: 'true'
        run: pytest -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Railway CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: railway-cli-${{ runner.os }}

      - name: Deploy to Railway
        run: |
          npm config set prefix ~/.npm-global
          export PATH=~/.npm-global/bin:$PATH
          npm install -g @railway/cli
          railway up --detach --service personal_portfolio
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PORTFOLIO_TOKEN }}
