<!-- app/templates/base.html -->
<!-- Base layout template shared by all pages. -->
<!-- Defines the HTML skeleton, loads Bootstrap and local CSS, and includes the global navbar and footer. -->
<!-- Includes SEO metadata blocks, Open Graph support, canonical URL support, Google Analytics integration, and reusable event tracking support. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}{{ site_name }}{% endblock %}</title>

    <meta
      name="description"
      content="{% block meta_description %}{{ default_meta_description }}{% endblock %}"
    />

    <link
      rel="canonical"
      href="{% block canonical_href %}{{ canonical_url }}{% endblock %}"
    />

    <meta property="og:site_name" content="{{ site_name }}" />
    <meta
      property="og:title"
      content="{% block og_title %}{{ site_name }}{% endblock %}"
    />
    <meta
      property="og:description"
      content="{% block og_description %}{{ default_meta_description }}{% endblock %}"
    />
    <meta
      property="og:type"
      content="{% block og_type %}{{ default_og_type }}{% endblock %}"
    />
    <meta
      property="og:url"
      content="{% block og_url %}{{ canonical_url }}{% endblock %}"
    />
    <meta
      property="og:image"
      content="{% block og_image %}{{ default_og_image }}{% endblock %}"
    />

    <!-- Connection hints for faster CDN loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Local CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />

    {% if google_analytics_id %}
      <!-- Google Analytics 4 -->
      <script
        async
        src="https://www.googletagmanager.com/gtag/js?id={{ google_analytics_id }}"
      ></script>
      <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
          dataLayer.push(arguments);
        }

        gtag("js", new Date());
        gtag("config", "{{ google_analytics_id }}");

        function trackEvent(eventName, eventParams = {}) {
          if (typeof gtag === "function") {
            gtag("event", eventName, eventParams);
          }
        }
      </script>
    {% endif %}
  </head>

  <body class="d-flex flex-column min-vh-100">
    {% include "components/navbar.html" %}

    <main class="flex-grow-1">
      <div class="container py-5">
        {% include "components/flash_messages.html" %}
        {% block content %}{% endblock %}
      </div>
    </main>

    {% include "components/footer.html" %}

    <!-- Scroll to Top Button (Centered) -->
    <button
      id="scrollToTopBtn"
      class="btn btn-dark scroll-to-top-btn"
      type="button"
      aria-label="Scroll to top"
    >
      ↑
    </button>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Local JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
