<!-- app/templates/base.html -->
<!-- Base layout template shared by all pages. -->
<!-- Defines the HTML skeleton, loads Bootstrap and local CSS, and includes the global navbar and footer. -->
<!-- Phase 6 Section 2: includes JS enhancements and centered scroll-to-top button. -->
<!-- Phase 6 Section 3: adds CDN connection hints for improved resource loading performance. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Portfolio{% endblock %}</title>

    <!-- Connection hints for faster CDN loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Local CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
  </head>

  <body class="d-flex flex-column min-vh-100">
    {% include "components/navbar.html" %}

    <main class="flex-grow-1">
      <div class="container py-5">
        {% include "components/flash_messages.html" %}
        {% block content %}{% endblock %}
      </div>
    </main>

    {% include "components/footer.html" %}

    <!-- Scroll to Top Button (Centered) -->
    <button
      id="scrollToTopBtn"
      class="btn btn-dark scroll-to-top-btn"
      type="button"
      aria-label="Scroll to top"
    >
      ↑
    </button>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Local JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
