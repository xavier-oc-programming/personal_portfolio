<!-- app/templates/components/navbar.html -->

<header class="border-bottom">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">
        Xavier O
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a
              class="nav-link {% if request.path == '/' %}active fw-semibold{% endif %}"
              href="{{ url_for('home') }}"
            >
              Home
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link {% if request.path.startswith('/about') %}active fw-semibold{% endif %}"
              href="{{ url_for('about') }}"
            >
              About
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link {% if request.path.startswith('/projects') %}active fw-semibold{% endif %}"
              href="{{ url_for('projects') }}"
            >
              Projects
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link {% if request.path.startswith('/contact') %}active fw-semibold{% endif %}"
              href="{{ url_for('contact') }}"
            >
              Contact
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
