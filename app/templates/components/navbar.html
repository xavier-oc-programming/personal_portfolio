<!-- app/templates/components/navbar.html -->
<!-- Shared navigation bar component. -->
<!-- Provides the main site navigation and highlights the active page based on the current route. -->
<!-- Phase 6 Section 2 update: improves accessibility, mobile navigation structure, and responsive behavior. -->

<header class="site-header border-bottom">
  <nav class="navbar navbar-expand-lg" aria-label="Primary site navigation">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">
        Xavier O
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
          <li class="nav-item">
            <a
              class="nav-link {% if request.path == '/' %}active fw-semibold{% endif %}"
              href="{{ url_for('home') }}"
              {% if request.path == '/' %}aria-current="page"{% endif %}
            >
              Home
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link {% if request.path.startswith('/about') %}active fw-semibold{% endif %}"
              href="{{ url_for('about') }}"
              {% if request.path.startswith('/about') %}aria-current="page"{% endif %}
            >
              About
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link {% if request.path.startswith('/projects') %}active fw-semibold{% endif %}"
              href="{{ url_for('projects') }}"
              {% if request.path.startswith('/projects') %}aria-current="page"{% endif %}
            >
              Projects
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link {% if request.path.startswith('/contact') %}active fw-semibold{% endif %}"
              href="{{ url_for('contact') }}"
              {% if request.path.startswith('/contact') %}aria-current="page"{% endif %}
            >
              Contact
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link {% if request.path.startswith('/api') %}active fw-semibold{% endif %}"
              href="{{ url_for('api_docs') }}"
              {% if request.path.startswith('/api') %}aria-current="page"{% endif %}
            >
              API
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
