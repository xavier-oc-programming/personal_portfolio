<div class="card">
  <div class="card-body">
    <h2 class="h5 card-title">{{ project.title }}</h2>

    {% if project.description %}
      <p class="card-text">{{ project.description }}</p>
    {% endif %}

    {% if project.primary_category %}
      <p class="text-muted mb-2">Category: {{ project.primary_category }}</p>
    {% endif %}

    {% if project.slug %}
      <a class="btn btn-sm btn-outline-dark" href="{{ url_for('project_detail', slug=project.slug) }}">
        View details
      </a>
    {% endif %}
  </div>
</div>
